# Release gate (Phase 8): every push and pull request to main must pass the tests, the build, and the
# answer-quality gate (evals/gate.py). No model, OpenSearch or Wazuh is contacted: everything runs on
# stubs, synthetic scenarios and the committed baseline.
name: release-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend packages
        run: npm ci
      - name: Install backend packages
        run: npm ci
        working-directory: backend
      - name: Backend tests
        run: npm test
        working-directory: backend
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npx vite build
      - name: Answer-quality gate
        run: python3 evals/gate.py
